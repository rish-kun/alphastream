# ============================================================
# Full Orchestration — Production Architecture in Docker
# ============================================================
# Replicates deploy-production.sh architecture:
# Nginx acts as the single entrypoint on port 80.
# Frontend and Backend do not expose ports directly to host.

services:
  # ── Infrastructure ──────────────────────────────────────────
  alphastream-postgres:
    image: postgres:16-alpine
    container_name: alphastream-postgres-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alphastream
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - alphastream_pgdata_prod:/var/lib/postgresql/data
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - alphastream-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    restart: unless-stopped

  alphastream-redis:
    image: redis:7-alpine
    container_name: alphastream-redis-prod
    volumes:
      - alphastream_redisdata_prod:/data
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    networks:
      - alphastream-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 96M
    restart: unless-stopped

  # ── Backend (FastAPI) ───────────────────────────────────────
  alphastream-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphastream-backend-prod
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@alphastream-postgres-prod:5432/alphastream
      REDIS_URL: redis://alphastream-redis-prod:6379/0
    networks:
      - alphastream-prod
    depends_on:
      alphastream-postgres:
        condition: service_healthy
      alphastream-redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Pipeline: Celery Worker ─────────────────────────────────
  alphastream-worker:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: alphastream-worker-prod
    command: ["uv", "run", "celery", "-A", "pipeline.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@alphastream-postgres-prod:5432/alphastream
      REDIS_URL: redis://alphastream-redis-prod:6379/0
    networks:
      - alphastream-prod
    depends_on:
      alphastream-postgres:
        condition: service_healthy
      alphastream-redis:
        condition: service_healthy
      alphastream-backend:
        condition: service_started
    restart: unless-stopped

  # ── Pipeline: Celery Beat (Scheduler) ───────────────────────
  alphastream-beat:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: alphastream-beat-prod
    command: ["uv", "run", "celery", "-A", "pipeline.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@alphastream-postgres-prod:5432/alphastream
      REDIS_URL: redis://alphastream-redis-prod:6379/0
    networks:
      - alphastream-prod
    depends_on:
      alphastream-postgres:
        condition: service_healthy
      alphastream-redis:
        condition: service_healthy
      alphastream-backend:
        condition: service_started
    restart: unless-stopped

  # ── Startup Seeder (one-shot) ────────────────────────────────
  alphastream-startup-seeder:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: alphastream-startup-seeder-prod
    command: ["uv", "run", "python", "scripts/startup_seed.py"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@alphastream-postgres-prod:5432/alphastream
      REDIS_URL: redis://alphastream-redis-prod:6379/0
      PYTHONPATH: /app
    networks:
      - alphastream-prod
    depends_on:
      alphastream-postgres:
        condition: service_healthy
      alphastream-redis:
        condition: service_healthy
      alphastream-worker:
        condition: service_started
    restart: "no"

  # ── Frontend (Next.js) ──────────────────────────────────────
  alphastream-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative URLs so the browser seamlessly issues requests mapped by Nginx
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_WS_URL: /api/v1
    container_name: alphastream-frontend-prod
    environment:
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-alphastream-secret-key-min-32-chars!!}
      BACKEND_URL: http://alphastream-backend-prod:8000/api/v1
    networks:
      - alphastream-prod
    depends_on:
      alphastream-backend:
        condition: service_started
    restart: unless-stopped

  # ── NGINX Proxy ──────────────────────────────────────────────
  alphastream-nginx:
    image: nginx:alpine
    container_name: alphastream-nginx-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    networks:
      - alphastream-prod
    depends_on:
      - alphastream-frontend
      - alphastream-backend
    restart: unless-stopped

networks:
  alphastream-prod:
    driver: bridge

volumes:
  alphastream_pgdata_prod:
  alphastream_redisdata_prod:
